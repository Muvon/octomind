name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

# A new push supersedes whatever is still running for the same branch or PR —
# there is no point burning runners on a commit nobody is looking at any more.
# Grouping by workflow + ref keeps master, each branch and each PR independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep target/ small enough for the ~14GB runner disk: incremental
  # compilation artifacts and debuginfo dominate debug-build size and
  # are useless in CI.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    name: Rust CI
    uses: muvon/ci-workflow/.github/workflows/rust-ci.yml@master
    with:
      feature-flags: '--all-features'
      setup-protoc: true
      tools: 'ripgrep,ast-grep'
      # Test job stays local below: needs ONNX static libs and HF model cache
      test: false
      doc: false
      # Shared tarpaulin job measured coverage but the Codecov upload has no
      # token, so nothing ever landed (codecov shows zero commits). Replaced
      # by the local `coverage` job below, which publishes the report on the
      # run page and as an artifact without any external service.
      coverage: false

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [1.99.1]
        include:
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: nightly
    continue-on-error: ${{ matrix.rust == 'nightly' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Setup protoc
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install ripgrep and ast-grep
      uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
      with:
        tool: ripgrep,ast-grep

    # rust-cache keys by exact rustc version — no cross-toolchain fallback.
    # The old restore-keys let beta restore stable's target/, which then got
    # fully rebuilt alongside → doubled disk usage → ENOSPC.
    # ort-sys's build script downloads ORT prebuilts (Windows/macOS) into
    # ort.pyke.io outside target/ and never re-runs once its output is fresh.
    # A restored target/ without that dir fails ort-sys with "could not find
    # native static library `onnxruntime`", so cache it alongside target/.
    - name: Cache dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        cache-on-failure: true
        cache-directories: |
          ~/AppData/Local/ort.pyke.io
          ~/Library/Caches/ort.pyke.io

    # Cache the HuggingFace model weights fetched by smoke tests
    # (`muvon/octomind-embed`, ~130MB safetensors). octolib stores them via
    # `dirs::cache_dir()/octolib/huggingface`, which expands to:
    #   Linux:   ~/.cache/octolib/huggingface
    #   macOS:   ~/Library/Caches/octolib/huggingface
    #   Windows: ~/AppData/Local/octolib/huggingface
    # Cache key invalidates when src/embeddings/mod.rs changes (e.g. MODEL_NAME).
    - name: Cache HuggingFace model weights
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/octolib/huggingface
          ~/Library/Caches/octolib/huggingface
          ~/AppData/Local/octolib/huggingface
        key: ${{ runner.os }}-octolib-hf-${{ hashFiles('src/embeddings/mod.rs') }}
        restore-keys: |
          ${{ runner.os }}-octolib-hf-

    # Linux: csukuangfj ships a single bundled libonnxruntime.a — ort-sys's
    # single-file shortcut links it directly. Just point ORT_LIB_LOCATION at
    # the extracted lib/ dir.
    # Windows MSVC: nothing to do — ort-sys's download-binaries feature pulls
    # pyke's prebuilts automatically when ORT_LIB_LOCATION is unset.
    - name: Download ONNX Runtime static library (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        ORT_VERSION="1.24.2"
        ORT_ASSET="onnxruntime-linux-x64-static_lib-${ORT_VERSION}-glibc2_17"
        curl -sL "https://github.com/csukuangfj/onnxruntime-libs/releases/download/v${ORT_VERSION}/${ORT_ASSET}.zip" -o /tmp/ort.zip
        unzip -q /tmp/ort.zip -d /tmp/ort
        echo "ORT_LIB_LOCATION=/tmp/ort/${ORT_ASSET}/lib" >> "$GITHUB_ENV"

    # Windows: ORT prebuilts (pyke download-binaries) are compiled with /MD
    # (dynamic CRT). Rust on MSVC defaults to /MT (static CRT), causing
    # __imp_* unresolved-symbol link errors. Switch to dynamic CRT to match.
    # vcruntime140.dll is present on all GitHub Windows runners.
    # esaxx-rs hardcodes static_crt(true) (/MT) while other C++ deps (mimalloc
    # via turso) follow -crt-static and compile /MD — link.exe rejects the
    # RuntimeLibrary mismatch (LNK2038). cc appends env flags last, so this
    # forces /MD onto every MSVC C++ object. cc only reads the target-scoped
    # var when building for that target, so it's inert elsewhere.
    - name: Run tests
      shell: bash
      env:
        RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=-crt-static' || '' }}
        CXXFLAGS_x86_64_pc_windows_msvc: -MD
      run: cargo test --verbose

  # Source-based coverage via cargo-llvm-cov (more accurate than tarpaulin).
  # The TOTAL line + per-file table land on the workflow run's summary page;
  # lcov.info is uploaded as an artifact for local diffing or a future badge.
  # Setup mirrors the Linux Test Suite job (protoc, tools, ONNX, HF cache).
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the badge JSON to the `badges` branch
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: 1.99.1
        components: llvm-tools-preview

    - name: Setup protoc
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install ripgrep, ast-grep and cargo-llvm-cov
      uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
      with:
        tool: ripgrep,ast-grep,cargo-llvm-cov

    - name: Cache dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        cache-on-failure: true

    - name: Cache HuggingFace model weights
      uses: actions/cache@v6
      with:
        path: ~/.cache/octolib/huggingface
        key: ${{ runner.os }}-octolib-hf-${{ hashFiles('src/embeddings/mod.rs') }}
        restore-keys: |
          ${{ runner.os }}-octolib-hf-

    - name: Download ONNX Runtime static library
      shell: bash
      run: |
        ORT_VERSION="1.24.2"
        ORT_ASSET="onnxruntime-linux-x64-static_lib-${ORT_VERSION}-glibc2_17"
        curl -sL "https://github.com/csukuangfj/onnxruntime-libs/releases/download/v${ORT_VERSION}/${ORT_ASSET}.zip" -o /tmp/ort.zip
        unzip -q /tmp/ort.zip -d /tmp/ort
        echo "ORT_LIB_LOCATION=/tmp/ort/${ORT_ASSET}/lib" >> "$GITHUB_ENV"

    - name: Generate coverage
      shell: bash
      run: |
        # Run the suite once with instrumentation, then render both formats
        # from the collected profiles. Test-only files are excluded from the
        # report so percentages describe product code.
        cargo llvm-cov --no-report
        cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex '_tests\.rs$'
        {
          echo '## Coverage'
          echo '```'
          cargo llvm-cov report --summary-only --ignore-filename-regex '_tests\.rs$' | tail -1
          echo '```'
          echo '<details><summary>Per-file coverage</summary>'
          echo ''
          echo '```'
          cargo llvm-cov report --summary-only --ignore-filename-regex '_tests\.rs$'
          echo '```'
          echo '</details>'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload lcov artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage-lcov
        path: lcov.info

    # README badge: shields.io endpoint reads coverage.json from the orphan
    # `badges` branch (force-pushed, single file, no history). Master pushes
    # only — PR runs (esp. from forks) have no write access.
    - name: Publish coverage badge
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pct=$(cargo llvm-cov report --summary-only --ignore-filename-regex '_tests\.rs$' | tail -1 | awk '{print $10}' | tr -d '%')
        color=$(awk -v p="$pct" 'BEGIN { print (p < 50 ? "e05d44" : p < 65 ? "fe7d37" : p < 80 ? "dfb317" : "4c1") }')
        badge_dir=$(mktemp -d)
        printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > "$badge_dir/coverage.json"
        cd "$badge_dir"
        git init -q -b badges
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add coverage.json
        git commit -q -m "chore: update coverage badge to ${pct}%"
        git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  musl-build:
    name: Musl Build (x86_64 + aarch64)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # Pyke ships no musl prebuilt of ONNX Runtime, so the musl targets link the
    # static library published by Muvon/onnxruntime-builds.
    - name: Download ONNX Runtime static library
      run: |
        asset="onnxruntime-1.24.2-${{ matrix.target }}.tar.gz"
        base="https://github.com/Muvon/onnxruntime-builds/releases/download/v1.24.2"
        curl -fsSL --retry 3 -O "$base/$asset" -O "$base/$asset.sha256"
        shasum -a 256 -c "$asset.sha256"
        mkdir onnxruntime
        tar -xzf "$asset" -C onnxruntime

    - name: Cache cargo registry and target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: docker-alpine-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          docker-alpine-${{ matrix.target }}-cargo-

    - name: Build in Alpine (mirrors release pipeline)
      run: |
        # The image must stay on the Alpine release the ONNX Runtime library was
        # built on (3.22), because the archive links against this image's C++ runtime.
        docker run --rm \
          --user 0:0 \
          -v "$(pwd):/workspace" \
          -w /workspace \
          rust:1.99.1-alpine3.22 \
          sh -c '
            set -eu
            apk add --no-cache \
              git perl bash musl-dev openssl-dev openssl-libs-static \
              pkgconfig gcc g++ \
              cmake make linux-headers python3 py3-pip patch

            rustup target add ${{ matrix.target }}

            # A directory holding libonnxruntime.a makes ort-sys link that one archive.
            export ORT_LIB_LOCATION=/workspace/onnxruntime
            # GCC 15 (Alpine 3.23) introduced __cpu_features2 in libgcc.
            # ORT'\''s cpuid_info.cc.o references it; musl static link needs
            # libgcc.a explicitly or the symbol is undefined at link time.
            export RUSTFLAGS="-C link-arg=-lgcc"
            cargo build --target ${{ matrix.target }}
          '

  brief:
    uses: muvon/ci-workflow/.github/workflows/brief.yml@master
    secrets: inherit
