name: Docker Build

on:
  push:
    branches: [ master, main ]
    paths:
      - 'Dockerfile'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes whatever is still running for the same branch or PR —
# there is no point burning runners on a commit nobody is looking at any more.
# Grouping by workflow + ref keeps master, each branch and each PR independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Get version from Cargo.toml
      id: version
      run: |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Build image (syntax + layer validation)
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: false
        build-args: |
          OCTOMIND_VERSION=${{ steps.version.outputs.version }}
