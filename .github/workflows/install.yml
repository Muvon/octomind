name: Install

# Installs the latest published release through install.ps1, so changes to it
# are checked on a real Windows host. The Scoop manifest is tested in
# Muvon/scoop-bucket.
on:
  push:
    branches: [ master, main, develop ]
    paths:
      - install.ps1
      - .github/workflows/install.yml
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - install.ps1
      - .github/workflows/install.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-ps1:
    name: install.ps1 (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1 (stock Windows), pwsh = PowerShell 7
        shell: [ powershell, pwsh ]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      # Authenticates the release lookup so shared runner IPs don't hit the API rate limit
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run install.ps1
      run: |
        $PSVersionTable.PSVersion
        Get-Content -Raw ./install.ps1 | Invoke-Expression
        octomind --version

    # Each step starts from the runner's environment, not the registry, so
    # rebuild PATH the way a new login shell would to prove the user PATH entry.
    - name: octomind --version in a fresh shell
      run: |
        $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
        (Get-Command octomind).Source
        octomind --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
