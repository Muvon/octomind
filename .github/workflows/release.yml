name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'  # Matches semver tags like 0.1.0, 1.0.0, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (semver format, e.g., 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-unknown-linux-musl
          os: ubuntu-latest
          archive: tar.gz
        - target: aarch64-unknown-linux-musl
          os: ubuntu-22.04-arm
          archive: tar.gz
        - target: x86_64-pc-windows-msvc
          os: windows-latest
          archive: zip
        - target: aarch64-pc-windows-msvc
          os: windows-11-arm
          archive: zip
        - target: aarch64-apple-darwin
          os: macos-15
          archive: tar.gz

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      with:
        targets: ${{ matrix.target }}

    - name: Setup protoc
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ endsWith(matrix.target, '-unknown-linux-musl') && 'docker-alpine' || runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ endsWith(matrix.target, '-unknown-linux-musl') && 'docker-alpine' || runner.os }}-${{ matrix.target }}-cargo-
          ${{ endsWith(matrix.target, '-unknown-linux-musl') && 'docker-alpine' || runner.os }}-cargo-

    # Pyke ships no musl prebuilt of ONNX Runtime, so the musl targets link the
    # static library published by Muvon/onnxruntime-builds.
    - name: Download ONNX Runtime static library
      if: endsWith(matrix.target, '-unknown-linux-musl')
      shell: sh
      run: |
        asset="onnxruntime-1.24.2-${{ matrix.target }}.tar.gz"
        base="https://github.com/Muvon/onnxruntime-builds/releases/download/v1.24.2"
        curl -fsSL --retry 3 -O "$base/$asset" -O "$base/$asset.sha256"
        shasum -a 256 -c "$asset.sha256"
        mkdir onnxruntime
        tar -xzf "$asset" -C onnxruntime

    - name: Build binary
      shell: sh
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          # Linux musl: build inside Alpine and link ort-sys against the static
          # ONNX Runtime extracted by the step above. The image must stay on the
          # Alpine release that library was built on (3.22), because the archive
          # links against this image's C++ runtime.
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            rust:1.99.1-alpine3.22 \
            sh -c '
              set -eu
              apk add --no-cache \
                git perl bash musl-dev openssl-dev openssl-libs-static \
                pkgconfig gcc g++ \
                cmake make linux-headers python3 py3-pip patch

              rustup target add ${{ matrix.target }}

              # A directory holding libonnxruntime.a makes ort-sys link that one archive.
              export ORT_LIB_LOCATION=/workspace/onnxruntime
              # GCC 15 (Alpine 3.23) introduced __cpu_features2 in libgcc.
              # ORT'\''s cpuid_info.cc.o references it; musl static link needs
              # libgcc.a explicitly or the symbol is undefined at link time.
              export RUSTFLAGS="-C link-arg=-lgcc"
              cargo build --release --target ${{ matrix.target }}
            '
        elif [ "${{ runner.os }}" = "Windows" ]; then
          # Windows: Pyke ships prebuilts for MSVC targets.
          # Pyke's prebuilt ORT static lib is compiled with /MD (dynamic CRT).
          # Rust on MSVC defaults to /MT (static CRT) → __imp_* unresolved
          # symbol errors at link time. Switch to dynamic CRT to match.
          # vcruntime140.dll is present on all Windows hosts.
          export RUSTFLAGS="-C target-feature=-crt-static"
          # esaxx-rs hardcodes static_crt(true) (/MT); mimalloc & co. follow
          # -crt-static (/MD). cc appends env flags last → force /MD on all
          # C++ objects so link.exe sees one RuntimeLibrary (avoids LNK2038).
          export CXXFLAGS="-MD"
          cargo build --release --target ${{ matrix.target }}
        else
          # Native build for other macOS targets (aarch64) — Pyke ships prebuilts.
          # Pyke's ort-sys 2.0.0-rc.15 prebuilt calls ___isPlatformVersionAtLeast
          # (CoreML @available checks). It lives only in clang's compiler-rt
          # archive, which rustc does not link on macOS, so pass it explicitly.
          export RUSTFLAGS="-C link-arg=$(xcrun clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a"
          cargo build --release --target ${{ matrix.target }}
        fi

    - name: Create archive directory
      shell: sh
      run: mkdir -p dist

    - name: Create archive (Unix)
      if: matrix.archive == 'tar.gz'
      shell: sh
      run: |
        cd target/${{ matrix.target }}/release
        case "${{ matrix.target }}" in
          *windows*)
            tar czf ../../../dist/octomind-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.tar.gz octomind.exe
            ;;
          *)
            tar czf ../../../dist/octomind-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.tar.gz octomind
            ;;
        esac

    - name: Create archive (Windows)
      if: matrix.archive == 'zip'
      shell: sh
      run: |
        cd target/${{ matrix.target }}/release
        7z a ../../../dist/octomind-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.zip octomind.exe

    - name: Write sha256 sidecars
      shell: bash
      run: |
        set -euo pipefail
        cd dist
        for archive in octomind-*; do
          case "$archive" in
            *.sha256) continue ;;
          esac
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
        done

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ matrix.target }}
        path: dist/*
        if-no-files-found: error

  publish-crate:
    name: Publish to Crates.io
    needs: build
    uses: muvon/ci-workflow/.github/workflows/rust-publish.yml@master
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      publish-flags: '--no-default-features'
      setup-protoc: true

  release:
    name: Create Release
    needs: [build, publish-crate]
    uses: muvon/ci-workflow/.github/workflows/release.yml@master
    permissions:
      contents: write # create the GitHub release and upload assets
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      artifacts: 'release-*'
      draft: false

  notify-homebrew:
    name: Notify Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch update to homebrew-tap
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TAP_GITHUB_TOKEN }}" \
            https://api.github.com/repos/muvon/homebrew-tap/dispatches \
            -d "{\"event_type\":\"octomind-release\",\"client_payload\":{\"version\":\"${{ needs.release.outputs.version }}\"}}"

  docker:
    name: Build and Push Docker Images
    needs: release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push image digests to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux/amd64
          runner: ubuntu-24.04
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase repository name
      id: repo
      run: echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Build and push Docker image by digest
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: true
        build-args: |
          OCTOMIND_VERSION=${{ needs.release.outputs.version }}
        outputs: type=image,name=ghcr.io/${{ steps.repo.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ matrix.platform }}
        cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  docker-merge:
    name: Merge Docker Manifests
    needs: [release, docker]
    runs-on: ubuntu-latest
    permissions:
      packages: write # push the multi-arch manifest to ghcr.io
    steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase repository name
      id: repo
      run: echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          -t ghcr.io/${{ steps.repo.outputs.repository }}:latest \
          -t ghcr.io/${{ steps.repo.outputs.repository }}:${{ needs.release.outputs.version }} \
          $(printf 'ghcr.io/${{ steps.repo.outputs.repository }}@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ghcr.io/${{ steps.repo.outputs.repository }}:latest
