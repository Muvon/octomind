[package]
name = "octomind"
version = "0.51.1"
edition = "2021"
authors = ["Muvon Un Limited <contact@muvon.io>"]
license = "Apache-2.0"
description = "Open-source AI coding agent and agent runtime: one binary, any model, MCP-native. Runs in terminal, CI, or as a daemon — guardrails in scripts, not approval popups."
homepage = "https://octomind.run"
repository = "https://github.com/muvon/octomind"
documentation = "https://octomind.muvon.io"
keywords = ["ai", "development", "assistant", "productivity", "conversational"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
rust-version = "1.95"
exclude = [
    "tests/fixtures/*",
    "examples/*",
    ".github/*",
    "docs/*",
    "scripts/*",
    "*.md",
    "install.sh"
]

# Enable static linking
[profile.release]
lto = true              # Enable Link Time Optimization
codegen-units = 1       # Reduce parallel code generation units for better optimization
panic = "abort"         # Abort on panic for smaller binary size
strip = true            # Strip symbols from binary
opt-level = "s"         # Optimize for size while keeping vectorization ("z" disables it and often runs slower for no size win)
overflow-checks = false # Disable overflow checks in release mode

[dependencies]
# octolib = { path = "../octolib", default-features = false, features = ["llm", "embeddings", "huggingface"] }
octolib = { version = "0.36.3", default-features = false, features = ["llm", "embeddings", "huggingface"] }
rmcp = { version = "3.1.4", default-features = false, features = [
	"client",                                  # MCP client service (2026-07-28 + legacy lifecycle)
	"transport-child-process",                 # stdio servers via tokio child process
	"transport-streamable-http-client-reqwest", # Streamable HTTP client transport
	"reqwest",                                 # rustls backend for the transport's reqwest
	"elicitation",                             # elicitation/create handler support (SEP-2322)
] }

tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "sync", "signal", "io-std", "net"] }
crossterm = "0.29.0"
indicatif = "0.18.6"
parking_lot = "0.12.5"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.25.0", features = ["v4"] }
tiktoken-rs = "0.12.0" # Token counter
reqwest = { version = "0.13.4", features = ["json", "rustls", "gzip"], default-features = false }
rustls-webpki = ">=0.103.12"
flate2 = "1.1"
zstd = "0.14"
anyhow = "1.0.104"
serde_json = "1.0.151"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
toml = "1.1"
lazy_static = "1.5.0"
fuzzy-matcher = "0.3.7"
tokio-util = { version = "0.7", features = ["rt", "compat"] }
reedline = { version = "0.51", features = ["bashisms", "external_printer"] }
nu-ansi-term = "0.50"
regex = "1.13.1"
colored = "3.1.1"
async-trait = "0.1.92"
termimad = "0.35.2"
# No plist-load/yaml-load: only bundled dumps are used (ThemeSet::load_defaults),
# and plist pulls quick-xml with open RUSTSEC advisories (2026-0194/0195).
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

url = "2.5.8"
dirs = "7.0.0"
glob = "0.3.4"
ignore = "0.4.33"
futures = "0.3.34"
dotenvy = "0.15.7"
arboard = "3.6.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
viuer = "0.11.0"
base64 = "0.23"
urlencoding = "2.1.3"
humantime-serde = "1.1.1"
tokio-tungstenite = "0.30.0"
futures-util = "0.3"

# OAuth 2.1 + PKCE authentication
oauth2 = { version = "5.0", features = ["reqwest", "rustls-tls"] }
sha2 = "0.11.0"
hex = "0.4"
serde_urlencoded = "0.7"
thiserror = "2.0"
open = "5"
tracing = { version = "0.1", default-features = false }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
agent-client-protocol = "2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
proctitle = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile = "3.27.0"
serial_test = "4.0.1"

[profile.dev]
opt-level = 1          # Basic optimizations without slowing compilation too much
debug = true           # Keep debug symbols for backtraces
debug-assertions = true # Keep runtime checks
overflow-checks = true  # Keep overflow checks
lto = false            # Disable Link Time Optimization to speed up builds
codegen-units = 256    # Use more codegen units for faster parallel compilation
incremental = true     # Enable incremental compilation
rpath = false          # Disable runtime search path
